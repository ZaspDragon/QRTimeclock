name: Apply unknown legacy identity fallback fix

on:
  push:
    branches:
      - fix/unknown-legacy-id-fallback
    paths:
      - scripts/apply_unknown_legacy_identity_fix.py
      - .github/workflows/apply-unknown-legacy-identity-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unknown-legacy-id-fallback
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded identity fallback patch
        run: python scripts/apply_unknown_legacy_identity_fix.py
      - name: Commit generated app update
        run: |
          if git diff --quiet -- app.js index.html; then
            echo "No app changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "Fix unknown legacy worker identity fallback"
          git push origin HEAD:fix/unknown-legacy-id-fallback
