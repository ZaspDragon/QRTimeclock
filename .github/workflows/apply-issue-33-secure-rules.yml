name: Apply issue 33 secure punch-history rules

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/**

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded rules patch from trusted main
        run: python scripts/apply_issue_33_secure_rules.py
      - name: Validate public history is closed
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('firestore.rules').read_text(encoding='utf-8')
          punch_block = text.split('match /punches/{punchId} {', 1)[1].split('match /punchGuards/{guardId} {', 1)[0]
          forbidden = [
              "resource.data.get('employeeId', '') == ''",
              'publicEmployeeIsActive(\n              resource.data',
          ]
          remaining = [marker for marker in forbidden if marker in punch_block]
          if remaining:
              raise SystemExit(f'Unauthenticated punch read markers remain: {remaining}')
          required = [
              'publicEmployeeAgencyAssignment(employeeId)',
              'publicEmployeeAgencyMatches(',
              'validAgencyId(request.resource.data.agencyId)',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit(f'Missing secure rule markers: {missing}')
          print('Validated: public punch creation remains agency-bound and public punch-history reads are removed.')
          PY
      - name: Commit secured rules
        run: |
          if git diff --quiet -- firestore.rules; then
            echo "No Firestore rule change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules
          git commit -m "Restrict unauthenticated punch-history reads"
          git push origin HEAD:main
