<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OH01 Time Clock</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
    body { display: flex; flex-direction: column; }
    .banner { flex: 0 0 auto; padding: 10px 14px; background: #123a63; color: #fff; font: 700 16px/1.25 Arial, sans-serif; text-align: center; }
    .banner small { display: block; margin-top: 3px; font-size: 12px; font-weight: 500; }
    iframe { flex: 1 1 auto; width: 100%; min-height: 0; border: 0; background: #fff; pointer-events: auto; touch-action: auto; }
  </style>
</head>
<body>
  <div class="banner">OH01 TIME CLOCK<small>Branch is automatically set to OH01.</small></div>
  <iframe id="clockFrame" src="./index.html?site=OH01&v=20260729-branch-lock2" title="OH01 Time Clock" allow="geolocation" scrolling="yes"></iframe>
  <script>
    const frame = document.getElementById('clockFrame');
    frame.addEventListener('load', () => {
      let attempts = 0;
      const timer = setInterval(() => {
        attempts += 1;
        try {
          const select = frame.contentDocument?.getElementById('workerBranchSelect');
          if (select) {
            select.value = 'OH01';
            select.dispatchEvent(new Event('change', { bubbles: true }));
            select.disabled = true;
            select.setAttribute('aria-label', 'Branch locked to OH01');
            const label = select.closest('label')?.querySelector('span');
            if (label) label.textContent = 'Branch (OH01 — automatically selected)';
            clearInterval(timer);
          } else if (attempts >= 30) {
            clearInterval(timer);
          }
        } catch (error) {
          clearInterval(timer);
          console.error('Could not apply OH01 branch context', error);
        }
      }, 150);
    });
  </script>
</body>
</html>
