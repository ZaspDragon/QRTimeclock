<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OH01 Time Clock</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; }
    .branch-banner { position: fixed; inset: 0 0 auto 0; z-index: 10; min-height: 54px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 14px; box-sizing: border-box; background: #123a63; color: #fff; font-weight: 800; letter-spacing: .04em; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
    .branch-banner small { font-weight: 600; opacity: .9; letter-spacing: 0; }
    iframe { position: fixed; inset: 54px 0 0 0; width: 100%; height: calc(100% - 54px); border: 0; background: #fff; }
  </style>
</head>
<body>
  <div class="branch-banner">OH01 TIME CLOCK <small>All punches from this QR code are for OH01</small></div>
  <iframe id="clockFrame" src="./index.html" title="OH01 Time Clock"></iframe>
  <script>
    (() => {
      const BRANCH = 'OH01';
      const frame = document.getElementById('clockFrame');

      function lockBranch() {
        try {
          const doc = frame.contentDocument;
          if (!doc) return;
          const select = doc.getElementById('workerBranchSelect');
          if (!select) return;
          if (select.value !== BRANCH) {
            select.value = BRANCH;
            select.dispatchEvent(new Event('change', { bubbles: true }));
          }
          select.disabled = true;
          select.setAttribute('aria-disabled', 'true');
          select.title = 'Branch is locked by this QR code';

          const label = doc.querySelector('label[for="workerBranchSelect"]');
          if (label) label.textContent = `Branch (locked to ${BRANCH})`;
        } catch (error) {
          console.error('Unable to lock branch context', error);
        }
      }

      frame.addEventListener('load', () => {
        lockBranch();
        const doc = frame.contentDocument;
        if (!doc) return;
        const observer = new MutationObserver(lockBranch);
        observer.observe(doc.documentElement, { childList: true, subtree: true, attributes: true });
        setInterval(lockBranch, 1000);
      });
    })();
  </script>
</body>
</html>
